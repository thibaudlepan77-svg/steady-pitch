// ---------------------------------------------------------------------------
// Constantes musicales
// ---------------------------------------------------------------------------

const LA_REFERENCE = 440;
const NOMS_NOTES = ["Do", "Do#", "Re", "Re#", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "La#", "Si"];

/** Ecart en cents entre deux hauteurs. Cent = centieme de demi-ton. */
function cents(hz        , reference        )         {
  if (hz <= 0 || reference <= 0) return NaN;
  return 1200 * Math.log2(hz / reference);
}

/**
 * LE LA DE REFERENCE EST UN PARAMETRE, ET CE N'EST PAS UN LUXE.
 * MESURE, cycle 11. Le piano de reference de l'universite de l'Iowa, enregistre
 * dans les regles, ressort a 442,2 Hz et non a 440. Ce n'est pas un defaut de
 * ce piano, c'est l'usage. Beaucoup d'orchestres et de conservatoires
 * europeens accordent a 442 ou 443, et la musique ancienne descend a 415.
 * UN ELEVE DONT L'INSTRUMENT EST ACCORDE A 442 SERAIT JUGE HUIT CENTS TROP
 * HAUT SUR CHAQUE NOTE, indefiniment, sans jamais atteindre le verdict le plus
 * haut et sans jamais comprendre pourquoi. C'est le genre de defaut qui produit
 * un avis a une etoile disant "l'application se trompe", exactement le grief
 * dont je fais mon argument de vente.
 */
function midiVersHz(midi        , laReference         = LA_REFERENCE)         {
  return laReference * Math.pow(2, (midi - 69) / 12);
}

/** Les la de reference usuels, proposes au reglage. La liste est courte
 *  volontairement, un reglage a curseur libre inviterait a bricoler. */
const REFERENCES_USUELLES                                  = [
  { hz: 415, usage: "musique ancienne" },
  { hz: 432, usage: "accord alternatif" },
  { hz: 440, usage: "norme internationale" },
  { hz: 442, usage: "usage courant en Europe" },
  { hz: 443, usage: "certains orchestres" },
];

function hzVersMidi(hz        )         {
  return 69 + 12 * Math.log2(hz / LA_REFERENCE);
}

function nomDeMidi(midi        )         {
  const m = Math.round(midi);
  return `${NOMS_NOTES[((m % 12) + 12) % 12]}${Math.floor(m / 12) - 1}`;

const MOTEUR_F_MIN = 65.0;

/**
 * LE PLAFOND FIABLE, et lui est un seuil doux, pas un mur.
 * MESURE, cycle 11. Justesse brute par octave, 98,0 pour cent a l'octave 5,

/** La note demandee est-elle jugeable par le moteur. Retourne null si oui. */
function cibleHorsPortee(cibleHz        )                          {
  if (!(cibleHz > 0)) return null;
  if (cibleHz < MOTEUR_F_MIN) return "GRAVE";
  if (cibleHz > MOTEUR_F_MAX_FIABLE) return "AIGU";
  return null;

const REGLAGES_DEFAUT           = {
  fMin: 70,
  fMax: 1100,
  confianceMin: 0.5,
  alphaEma: 0.25,
  // Un debutant ne tient pas dix cents. Le declarer faux le fait desinstaller.
  tolJuste: 45,
  tolBien: 25,
  tolExcellent: 15,
  partAttaqueIgnoree: 1 / 3,
  attaqueMinMs: 0,
  msParTrame: 46.4,
  porteRelativeRatio: 0,
  laReference: LA_REFERENCE,
  tramesMin: 4,
};

/** Tessitures usuelles, proposees a la calibration. Bornes larges volontaires. */
const TESSITURES                                                 = {
  basse: { fMin: 70, fMax: 400 },
  baryton: { fMin: 85, fMax: 450 },
  tenor: { fMin: 110, fMax: 550 },
  alto: { fMin: 150, fMax: 700 },
  mezzo: { fMin: 180, fMax: 900 },
  soprano: { fMin: 220, fMax: 1100 },
  enfant: { fMin: 200, fMax: 1100 },
  large: { fMin: 70, fMax: 1100 },
};

// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
/**
 * POURQUOI CE MODE EXISTE, ET IL VAUT UN PARAGRAPHE.
 * La mesure du chantier 17 a montre que la poche de la voix seule ne compte que
 * deux titres vivants, quand la poche voisine, la lecture de notes jouee, en
 * compte cinq et vingt fois plus de demande. Or lire une portee et la CHANTER

 * produit le son. Et ce noyau ne fait aucune difference entre les deux, une
 * hauteur est une hauteur.
 * Servir les deux ne demande donc PAS un second moteur, cela demande ce seul
 * reglage. C'est tout le cout de l'elargissement.

 *     toute voix. Garder les bornes vocales sur un instrument rejetterait des
 *     notes parfaitement valides.
 *   - LA TOLERANCE. Un instrument accorde ne derive pas, un chanteur si. Exiger
 *     d'une voix la precision d'un piano decourage, et accorder a un piano la
 *     tolerance d'une voix laisse passer des fausses notes. Les seuils vocaux
 *     viennent de la mesure, la derive naturelle mediane observee sur 29
 *     chanteurs est d'environ 10 cents, d'ou une tolerance genereuse a 45.
 *   - L'ATTAQUE. Une note jouee s'etablit presque instantanement, une note
 *     chantee arrive par un glissement. On jette un tiers du debut pour la voix,
 *     mesure a l'appui, et beaucoup moins pour un instrument.
 */
                                               

const REGLAGES_PAR_MODE                                        = {
  voix: {
    fMin: 70, fMax: 1100,
    tolJuste: 45, tolBien: 25, tolExcellent: 15,
    partAttaqueIgnoree: 1 / 3,
    attaqueMinMs: 0,
    // La porte fixe reste, et ce n'est pas un oubli. Sur les deux corpus
    // vocaux elle n'a jamais rejete une seule trame juste, elle ne coute donc
    // rien ici, et la tessiture choisie a la calibration est une fonction du
    // produit et pas seulement un filtre. On ne remplace pas ce qui est mesure
    // bon par ce qui est mesure bon ailleurs.
    porteRelativeRatio: 0,
  },
  instrument: {
    // CORRIGE le 2026-08-25 (cycle 11) APRES MESURE. La version precedente
    // annoncait 27 a 4200 Hz, deduite de l'etendue d'un piano et jamais
    // confrontee au moteur. Le moteur ne descend pas sous 65,41 Hz, il y rend
    // zero pour cent de bonnes reponses sur 103 notes.
    fMin: MOTEUR_F_MIN, fMax: MOTEUR_F_MAX_FIABLE,
    // un instrument accorde tient sa note, on peut donc etre plus exigeant
    tolJuste: 25, tolBien: 12, tolExcellent: 6,
    // l'attaque d'une corde ou d'un marteau est breve mais elle est REELLE,
    // et elle se compte en millisecondes. Voir `attaqueMinMs`.
    partAttaqueIgnoree: 0.15,
    attaqueMinMs: 120,
    // dix points de justesse, gagnes en retirant un filtre. Voir le champ.
    porteRelativeRatio: 2.2,
  },
};

/** Construit les reglages d'une seance. Le mode d'abord, la tessiture ensuite
 *  si l'on chante, et les surcharges explicites en dernier. */
function reglagesPour(
  mode            ,
  tessiture         ,
  surcharges                    = {}
)           {
  const base = { ...REGLAGES_DEFAUT, ...REGLAGES_PAR_MODE[mode] };
  // La tessiture ne s'applique qu'a la voix. Un piano n'a pas de tessiture au
  // sens vocal, et l'appliquer amputerait son clavier.
  if (mode === "voix" && tessiture && TESSITURES[tessiture]) {
    base.fMin = TESSITURES[tessiture].fMin;
    base.fMax = TESSITURES[tessiture].fMax;
  }
  return { ...base, ...surcharges };

// ---------------------------------------------------------------------------
// L'entree, telle que la rend react-native-pitchy
// ---------------------------------------------------------------------------

                        
                                                                
                             
 

                           
                   
                                                          
                     
                                        
                   
                                                           
                
                                                                          
                         
                         
                     
                           
                                                                  
                      
                                                                
                                
 

// ---------------------------------------------------------------------------
// Les parades, une par une
// ---------------------------------------------------------------------------

/**
 * Ramene une hauteur dans l'octave de la cible.
 *
 * MESURE, ET ELLE NUANCE CETTE FONCTION. Sur des donnees correctement annotees
 * ce repli ne gagne que 0,6 point, parce qu'un detecteur bien regle ne se
 * trompe presque jamais d'octave. Ce n'est donc PAS le levier de qualite que je
 * croyais, c'est une SECURITE bon marche. On la garde parce qu'elle ne coute
 * rien et qu'elle transforme l'erreur la plus humiliante pour l'utilisateur,
 * etre declare faux d'une octave alors qu'on chante juste, en non-evenement.
 */
function replierOctave(hz        , cibleHz        )         {
  if (hz <= 0 || cibleHz <= 0) return hz;
  const k = Math.round(Math.log2(hz / cibleHz));
  return hz / Math.pow(2, k);
}

/** Mediane, sans dependance. */
function mediane(xs          )         {
  if (xs.length === 0) return NaN;
  const t = [...xs].sort((a, b) => a - b);
  const m = t.length >> 1;
  return t.length % 2 ? t[m] : (t[m - 1] + t[m]) / 2;
}

/**
 * Note une tentative complete contre une hauteur cible.
 * C'est la seule fonction que l'interface a besoin d'appeler.
 */
function noterTentative(
  trames         ,
  cibleHz        ,
  reglages           = REGLAGES_DEFAUT
)           {
  const retenues           = [];
  const affichage           = [];
  let ema                = null;
  let rejetConfiance = 0;
  let rejetPlage = 0;
  let octavesCorrigees = 0;

  // LA NOTE DEMANDEE EST-ELLE JUGEABLE. On repond avant de juger quoi que ce
  // soit, parce qu'un verdict FAUX rendu sur une note que le moteur n'entend
  // pas est un mensonge, et le pire de tous, celui qui accuse l'utilisateur.
  const horsPortee = cibleHorsPortee(cibleHz);
  if (horsPortee !== null) {
    return {
      verdict: "HORS_PORTEE", ecartCents: NaN, hzMedian: NaN, score: 0,
      tramesRetenues: 0, rejetConfiance: 0, rejetPlage: 0,
      octavesCorrigees: 0, affichage: [], horsPortee,
    };
  }

  // LA PORTE DE PLAGE. Relative a la note demandee quand le mode le prevoit,
  // fixe sinon. Mesure du cycle 11, la porte fixe jetait 288 bonnes reponses
  // sur 2913 des qu'on sortait de la tessiture d'une voix.
  const relatif = reglages.porteRelativeRatio > 0;
  const borneBasse = relatif
    ? Math.max(MOTEUR_F_MIN, cibleHz / reglages.porteRelativeRatio)
    : reglages.fMin;
  const borneHaute = relatif
    ? cibleHz * reglages.porteRelativeRatio
    : reglages.fMax;

  for (const t of trames) {
    if (!(t.hz > 0) || t.confiance < reglages.confianceMin) {
      rejetConfiance++;
      continue;
    }
    if (t.hz < borneBasse || t.hz > borneHaute) {
      rejetPlage++;
      continue;
    }
    const corrige = replierOctave(t.hz, cibleHz);
    if (Math.abs(cents(corrige, t.hz)) > 1) octavesCorrigees++;
    retenues.push(corrige);
    ema = ema === null ? corrige : reglages.alphaEma * corrige + (1 - reglages.alphaEma) * ema;
    affichage.push(ema);
  }

  if (retenues.length < reglages.tramesMin) {
    return {
      verdict: "SILENCE", ecartCents: NaN, hzMedian: NaN, score: 0,
      tramesRetenues: retenues.length, rejetConfiance, rejetPlage,
      octavesCorrigees, affichage,
    };
  }

  // On jette l'attaque. Deux mesures du meme phenomene, une en proportion pour
  // le glissando du chanteur, une en millisecondes pour le choc de la corde.
  // On prend la plus exigeante des deux, puis on garde toujours de quoi juger.
  const parFraction = Math.floor(retenues.length * reglages.partAttaqueIgnoree);
  const parDuree = reglages.msParTrame > 0
    ? Math.ceil(reglages.attaqueMinMs / reglages.msParTrame)
    : 0;
  const plafond = Math.max(0, retenues.length - reglages.tramesMin);
  const debut = Math.min(Math.max(parFraction, parDuree), plafond);
  const fenetre = retenues.slice(debut);
  const hzMedian = mediane(fenetre.length ? fenetre : retenues);
  const ecart = cents(hzMedian, cibleHz);
  const abs = Math.abs(ecart);

  let verdict         ;
  if (abs <= reglages.tolExcellent) verdict = "EXCELLENT";
  else if (abs <= reglages.tolBien) verdict = "BIEN";
  else if (abs <= reglages.tolJuste) verdict = "JUSTE";
  else verdict = "FAUX";

  // Score lineaire, 100 a zero cent, 0 a la tolerance de justesse doublee.
  const score = Math.max(0, Math.round(100 * (1 - abs / (reglages.tolJuste * 2))));

  return {
    verdict, ecartCents: ecart, hzMedian, score,
    tramesRetenues: retenues.length, rejetConfiance, rejetPlage,
    octavesCorrigees, affichage,
  };
}

/** Position du curseur, de -1 (trop grave) a +1 (trop aigu), bornee. */
function positionCurseur(hz        , cibleHz        , etendueCents = 100)         {
  const c = cents(hz, cibleHz);
  if (Number.isNaN(c)) return 0;
  return Math.max(-1, Math.min(1, c / etendueCents));
}
  return { LA_REFERENCE, NOMS_NOTES, cents, midiVersHz, REFERENCES_USUELLES, hzVersMidi, nomDeMidi, MOTEUR_F_MIN, MOTEUR_F_MAX_FIABLE, cibleHorsPortee, REGLAGES_DEFAUT, TESSITURES, REGLAGES_PAR_MODE, reglagesPour, replierOctave, mediane, noterTentative, positionCurseur };
})();

  // lettres allemandes, le si est H et le si bemol est B

  if (!NOMS[systeme]) systeme = "lettres";

/** Toniques conseillees par tessiture, en midi. Choisies pour que le
 *  curriculum entier tienne confortablement dans la voix. */
const TONIQUE_PAR_TESSITURE                         = {
  basse: 41,     // Fa2
  baryton: 45,   // La2
  tenor: 48,     // Do3
  alto: 53,      // Fa3
  mezzo: 55,     // Sol3
  soprano: 60,   // Do4
  enfant: 60,    // Do4
  large: 48,     // Do3
};

function preparer(exercice          , toniqueMidi        ,
                         laReference = 440)                 {
  return exercice.degres.map((d, i) => {
    const midi = toniqueMidi + d;
    return {
      // La hauteur cible depend du la de reference de l'utilisateur, mesure du
      // cycle 11. Le NOM de la note, lui, n'en depend pas.
      midi, hz: midiVersHz(midi, laReference), nom: nomDeMidi(midi),
      solfege: exercice.solfege[i],
    };
  });
}

/** Etendue d'un exercice, en demi-tons. Sert a verifier qu'il tient dans la voix. */
function etendue(exercice          )         {
  return Math.max(...exercice.degres) - Math.min(...exercice.degres);
}

/** Le plus grand saut de l'exercice, en demi-tons. Mesure sa difficulte reelle. */
function plusGrandSaut(exercice          )         {
  let m = 0;
  for (let i = 1; i < exercice.degres.length; i++) {
    m = Math.max(m, Math.abs(exercice.degres[i] - exercice.degres[i - 1]));
  }
  return m;
}

/** Les degres utilises par un exercice, tries. */
function degresUtilises(exercice          )           {
  return [...new Set(exercice.degres)].sort((a, b) => a - b);
}
  return { DEGRE, CURRICULUM, TONIQUE_PAR_TESSITURE, preparer, etendue, plusGrandSaut, degresUtilises };
})();

 * hasard non fourni, aucune mutation globale. Deux appels identiques rendent

const REGLES_DEFAUT               = {
  verdictsAcceptes: ["EXCELLENT", "BIEN", "JUSTE"],
  essaisAvantAide: 3,
  essaisAvantPassage: 6,
  partPourValider: 0.8,
};

// ---------------------------------------------------------------------------
// L'etat d'une seance
// ---------------------------------------------------------------------------

                   
                                                       
                                                                          
                                                              
                                                                       
                     // plus d'exercice a faire

                           
                
                     
                 
                   
                  
                                                                                
                        
                                                                         
                                                                            
                      
 

                             
                                                                           
                        
                      
                    
                    
               
                                                            
                          
                                                                         
                                                                       
                        
                                                                    
                      
 

                                
                     
                         
                        
                       
                          
                      
                                                                            
                      
                  
                                       
 

// ---------------------------------------------------------------------------
// Ouverture
// ---------------------------------------------------------------------------

/**
 * LE CATALOGUE EST UN PARAMETRE, ET C'EST LA MESURE DU CYCLE 11.
 * Mon plan affirme que la replication est le modele economique, plusieurs
 * titres sur un seul coeur. Cette affirmation ne valait rien tant qu'un second
 * titre n'existait pas, exactement comme l'equivalence voix et instrument ne
 * valait rien avant d'etre mesuree. Rendre le catalogue parametrable est le
 * SEUL changement qu'a demande le titre numero 2. Le reste du fichier n'a pas
 * bouge d'une ligne.
 */
function trouver(id        , catalogue            )           {
  const e = catalogue.find(x => x.id === id);
  if (!e) throw new Error(`exercice inconnu, ${id}`);
  return e;
}

function etatsNotes(ex          , toniqueMidi        , laReference        )             {
  return preparer(ex, toniqueMidi, laReference).map((note, index) => ({
    index, note, essais: 0, reussie: false, passee: false,
    meilleurEcart: NaN,
    horsPortee: cibleHorsPortee(note.hz) !== null,
  }));
}

/**
 * Ouvre une seance sur une liste d'exercices, dans une tonique donnee.
 * La liste est fournie par l'appelant et non deduite ici, pour qu'un autre
 * titre puisse batir la sienne sans toucher a ce fichier.
 */
function ouvrir(exerciceIds          , toniqueMidi        ,
                       catalogue             = CURRICULUM,
                       laReference = 440)             {
  if (exerciceIds.length === 0) {
    return {
      exercices: [], indexExercice: 0, toniqueMidi, notes: [], indexNote: 0,
      etape: "SEANCE_FINIE", bilans: [], catalogue, laReference,
    };
  }
  const notes = etatsNotes(trouver(exerciceIds[0], catalogue), toniqueMidi, laReference);
  const depart = premiereJugeable(notes, 0);
  return {
    exercices: [...exerciceIds], indexExercice: 0, toniqueMidi,
    notes, indexNote: depart < 0 ? notes.length : depart,
    etape: depart < 0 ? "EXERCICE_FINI" : "ATTENTE",
    bilans: [], catalogue, laReference,
  };
}

/** La premiere note jugeable a partir d'un index. Les notes hors de portee du
 *  moteur sont sautees sans jamais etre presentees, parce qu'on ne demande pas
 *  a quelqu'un de produire un son qu'on ne saura pas ecouter. */
function premiereJugeable(notes            , depuis        )         {
  for (let i = depuis; i < notes.length; i++) {
    if (!notes[i].horsPortee) return i;
  }
  return -1;
}

// ---------------------------------------------------------------------------
// Le pas de la seance
// ---------------------------------------------------------------------------

                         
                   
                     
                   
                                                              
                           
 

/**
 * Traite UNE tentative sur la note courante et rend le nouvel etat.
 * L'etat d'entree n'est jamais modifie, on en rend un neuf. Un etat immuable
 * est ce qui permet a un ecran de le comparer d'un rendu a l'autre, et a un
 * banc d'essai de rejouer une seance entiere sans effet de bord.
 */
function tenter(etat            , trames                                      ,
                       reglages          ,
                       regles               = REGLES_DEFAUT)         {
  if (etat.etape === "SEANCE_FINIE" || etat.indexNote >= etat.notes.length) {
    return {
      etat, accepte: false, exerciceTermine: false,
      resultat: noterTentative([], 0, reglages),
    };
  }

  const notes = etat.notes.map(n => ({ ...n }));
  const courante = notes[etat.indexNote];
  const r = noterTentative(trames, courante.note.hz, reglages);
  courante.essais++;

  const accepte = regles.verdictsAcceptes.includes(r.verdict);
  if (Number.isFinite(r.ecartCents)) {
    const a = Math.abs(r.ecartCents);
    if (!Number.isFinite(courante.meilleurEcart) || a < courante.meilleurEcart) {
      courante.meilleurEcart = a;
    }
  }
  if (accepte) courante.reussie = true;
  else if (courante.essais >= regles.essaisAvantPassage) courante.passee = true;

  let suivant = { ...etat, notes };

  if (courante.reussie || courante.passee) {
    const i = premiereJugeable(notes, etat.indexNote + 1);
    if (i < 0) {
      suivant = { ...suivant, indexNote: notes.length, etape: "EXERCICE_FINI" };
    } else {
      suivant = { ...suivant, indexNote: i, etape: "NOTE_FINIE" };
    }
  } else if (courante.essais >= regles.essaisAvantAide) {
    suivant = { ...suivant, etape: "AIDE" };
  } else {
    suivant = { ...suivant, etape: "ATTENTE" };
  }

  return {
    etat: suivant, resultat: r, accepte,
    exerciceTermine: suivant.etape === "EXERCICE_FINI",
  };
}

// ---------------------------------------------------------------------------
// Cloture d'un exercice et passage au suivant
// ---------------------------------------------------------------------------

function mediane(xs          )         {
  const t = xs.filter(Number.isFinite).sort((a, b) => a - b);
  if (t.length === 0) return NaN;
  const m = t.length >> 1;
  return t.length % 2 ? t[m] : (t[m - 1] + t[m]) / 2;
}

function bilan(etat            )                {
  const notes = etat.notes;
  const jugeables = notes.filter(n => !n.horsPortee);
  const reussies = jugeables.filter(n => n.reussie).length;
  const essais = notes.reduce((s, n) => s + n.essais, 0);
  const part = jugeables.length ? reussies / jugeables.length : 0;
  const ec = mediane(notes.map(n => n.meilleurEcart));
  // Le score recompense la justesse ET l'economie d'essais. Un exercice
  // reussi du premier coup vaut plus que le meme reussi au sixieme, sinon la
  // progression ne veut rien dire et l'utilisateur le sent tout de suite.
  const parfait = jugeables.length;
  const rendement = essais > 0 ? Math.min(1, parfait / essais) : 0;
  return {
    exerciceId: etat.exercices[etat.indexExercice] ?? "",
    notesDemandees: jugeables.length,
    notesReussies: reussies,
    notesPassees: jugeables.filter(n => n.passee).length,
    notesHorsPortee: notes.length - jugeables.length,
    essaisTotal: essais,
    ecartMedian: ec,
    valide: part >= REGLES_DEFAUT.partPourValider,
    score: Math.round(100 * (0.7 * part + 0.3 * rendement)),
  };
}

/** Ferme l'exercice courant, enregistre son bilan et ouvre le suivant. */
function exerciceSuivant(etat            )             {
  const b = bilan(etat);
  const bilans = [...etat.bilans, b];
  const i = etat.indexExercice + 1;
  if (i >= etat.exercices.length) {
    return { ...etat, bilans, indexExercice: i, etape: "SEANCE_FINIE" };
  }
  const notes = etatsNotes(trouver(etat.exercices[i], etat.catalogue),
                           etat.toniqueMidi, etat.laReference);
  const depart = premiereJugeable(notes, 0);
  return {
    ...etat, bilans, indexExercice: i, notes,
    indexNote: depart < 0 ? notes.length : depart,
    etape: depart < 0 ? "EXERCICE_FINI" : "ATTENTE",
  };
}

// ---------------------------------------------------------------------------
// Le resume de fin de seance, ce que l'utilisateur emporte
// ---------------------------------------------------------------------------

                               
                         
                           
                        
                         
                      
                      
                     
                                                                              
                                        
                  
 

function resumer(etat            )               {
  const b = etat.bilans;
  const dem = b.reduce((s, x) => s + x.notesDemandees, 0);
  const reu = b.reduce((s, x) => s + x.notesReussies, 0);
  const pire = b.length
    ? b.reduce((p, x) => (x.score < p.score ? x : p), b[0])
    : null;
  return {
    exercicesFaits: b.length,
    exercicesValides: b.filter(x => x.valide).length,
    notesReussies: reu,
    notesDemandees: dem,
    essaisTotal: b.reduce((s, x) => s + x.essaisTotal, 0),
    ecartMedian: mediane(b.map(x => x.ecartMedian)),
    scoreMoyen: b.length ? Math.round(b.reduce((s, x) => s + x.score, 0) / b.length) : 0,
    aRevoir: pire && !pire.valide ? pire.exerciceId : "",
  };
}

// ---------------------------------------------------------------------------
// LE CHOIX DE LA SEANCE DU JOUR
// ---------------------------------------------------------------------------

/**
 * Construit la liste d'exercices d'une seance a partir de ce qui a deja ete
 * valide. Deux principes, et ils viennent des avis negatifs lus au cycle 10.
 *   - ON NE REPART JAMAIS DE ZERO. Le grief le plus frequent apres la
 *     detection est de devoir refaire ce qui est acquis.
 *   - ON REVOIT UN ACQUIS AVANT D'EN AJOUTER UN NEUF. Un exercice deja valide
 *     ouvre la seance, pour donner une reussite en premier.
 */
function seanceDuJour(validesIds          , longueur = 5,
                             catalogue             = CURRICULUM)           {
  const valides = new Set(validesIds);
  const neufs = catalogue.filter(e => !valides.has(e.id)).map(e => e.id);
  const revus = catalogue.filter(e => valides.has(e.id)).map(e => e.id);
  const liste           = [];
  // un rappel d'abord, le dernier valide, celui qui est le plus frais
  if (revus.length) liste.push(revus[revus.length - 1]);
  for (const id of neufs) {
    if (liste.length >= longueur) break;
    liste.push(id);
  }
  // si tout est valide, on revoit les plus anciens
  for (const id of revus) {
    if (liste.length >= longueur) break;
    if (!liste.includes(id)) liste.push(id);
  }
  return liste;
}
  return { REGLES_DEFAUT, ouvrir, tenter, bilan, exerciceSuivant, resumer, seanceDuJour };
})();

function tonDe(r                 )      {
  if (!r) return "neutre";
  switch (r.verdict) {
    case "EXCELLENT":
    case "BIEN":
      return "succes";
    case "JUSTE":
      return "presque";
    case "FAUX":
      return "rate";
    case "HORS_PORTEE":
      return "inerte";
    default:
      return "neutre";
  }
}

/**
 * Construit tout ce que l'ecran doit afficher, a partir de l'etat de seance et

 */
function vue(etat            , dernier                 ,
                    ctx          )            {
  const fini = etat.etape === "SEANCE_FINIE";
  const noteCourante = etat.notes[etat.indexNote];

  // Les notes hors de portee ne sont jamais presentees, donc l'index courant
  // designe toujours une note jugeable, ou depasse le tableau.
  const jugeables = etat.notes.filter(n => !n.horsPortee);
  const faites = jugeables.filter(n => n.reussie || n.passee).length;
  const avancement = jugeables.length ? faites / jugeables.length : 1;

  if (fini || !noteCourante) {
    return {
      noteDemandee: "", consigne: "", positionTexte: "",
      curseur: 0, curseurVisible: false, ton: "neutre",
      retour: "", annonce: "",
      boutons: [{
        cle: "terminer", libelle: t("suivant", ctx.langue),
        actif: true, principal: true,
      }],
      avancement: 1, fini: true,
    };
  }

  // LE MENSONGE D'ECRAN QUE MON BANC A TROUVE, ET IL ETAIT SERIEUX.
  // `tenter` avance automatiquement des qu'une note est reussie ou passee. Si
  // l'ecran affichait bêtement la note courante, il montrerait la note

  // "Parfait" sous une note qu'il n'a pas encore chantee.

  // faire, avec son verdict, et le bouton suivant devient l'action principale.
  const vientDeFinir = etat.etape === "NOTE_FINIE" && dernier !== null;
  let affichee = noteCourante;
  if (vientDeFinir) {
    for (let i = etat.indexNote - 1; i >= 0; i--) {
      if (etat.notes[i].reussie || etat.notes[i].passee) {
        affichee = etat.notes[i];
        break;
      }
    }
  }

  const nom = nommerNote(affichee.note.midi, ctx.systeme, ctx.toniqueMidi);
  const rangJugeable = jugeables.indexOf(affichee) + 1;

  // LE CURSEUR NE S'AFFICHE QUE QUAND IL VEUT DIRE QUELQUE CHOSE. Un curseur
  // fige a zero pendant qu'on ne chante pas laisse croire qu'on chante juste.
  const curseurVisible = dernier !== null
    && dernier.verdict !== "SILENCE"
    && dernier.verdict !== "HORS_PORTEE"
    && Number.isFinite(dernier.hzMedian);

  const boutons           = [];
  // On ne propose d'ECOUTER la note qu'apres trois echecs, et jamais avant.
  // Offrir la reponse d'emblee supprime l'effort, donc l'apprentissage.
  boutons.push({
    cle: "ecouter", libelle: t("reessayer", ctx.langue),
    actif: etat.etape === "AIDE", principal: false,
  });
  boutons.push({
    cle: "suivant", libelle: t("suivant", ctx.langue),
    actif: vientDeFinir, principal: vientDeFinir,
  });

  return {
    noteDemandee: nom,
    consigne: t(ctx.chante ? "chantez" : "jouez", ctx.langue),
    positionTexte: `${rangJugeable} ${t("sur", ctx.langue)} ${jugeables.length}`,
    curseur: curseurVisible && dernier
      ? positionCurseur(dernier.hzMedian, affichee.note.hz)
      : 0,
    curseurVisible,
    ton: tonDe(dernier),
    retour: dernier ? annoncer(dernier, ctx.langue) : "",
    annonce: dernier
      ? annoncer(dernier, ctx.langue)
      : annoncerCible(affichee.note.midi, ctx.chante, ctx.langue,
                      ctx.systeme, ctx.toniqueMidi),
    boutons,
    avancement,
    fini: false,
  };
}

function vueResume(etat            , ctx          )            {
  const r               = resumer(etat);
  const part = r.notesDemandees ? r.notesReussies / r.notesDemandees : 0;
  const ton      = part >= 0.9 ? "succes" : part >= 0.6 ? "presque" : "rate";

  const lignes = [
    { libelle: t("score", ctx.langue), valeur: String(r.scoreMoyen) },
    {
      libelle: t("progression", ctx.langue),
      valeur: `${r.notesReussies} ${t("sur", ctx.langue)} ${r.notesDemandees}`,
    },
  ];
  if (Number.isFinite(r.ecartMedian)) {
    // CORRIGE AU CYCLE 11. Le libelle etait "cents", ce qui donnait la ligne
    // "cents 6" sur l'ecran de fin. Une unite n'est pas un libelle. Les
    // maquettes generees par le produit l'ont rendu visible en une image, ce
    // que trois relectures du code n'avaient pas fait.
    lignes.push({
      libelle: t("ecart_moyen", ctx.langue),
      valeur: `${Math.round(r.ecartMedian)} ${t("cents", ctx.langue)}`,
    });
  }

  // UNE SEULE PHRASE, ET ELLE PARLE DE LA SUITE, PAS DU PASSE. Un resume qui
  // recapitule fait fermer l'application, un resume qui designe la prochaine

  const phrase = r.aRevoir

      `${t("score", ctx.langue)} ${r.scoreMoyen}`,
      `${r.notesReussies} ${t("sur", ctx.langue)} ${r.notesDemandees}`,
      phrase,
    ].join(", "),
    ton,
  };

    // s'ouvrir vaut moins qu'un produit qui utilise une vieille API.
    mode = "repli";
    noeud = contexte.createScriptProcessor(TAILLE_FENETRE, 1, 1);
    noeud.onaudioprocess = (e) => {
      if (receveur) receveur(e.inputBuffer.getChannelData(0).slice());
    };
    // Le noeud deprecie ne s'execute que s'il est relie a une sortie. On le
    // relie a un gain nul, sinon l'utilisateur s'entendrait dans ses enceintes
    // et le microphone reprendrait sa propre sortie.
    const muet = contexte.createGain();
    muet.gain.value = 0;
    noeud.connect(muet);
    muet.connect(contexte.destination);
  }

  if (avecMicro) await brancherMicro();
  await degourdir();
  return { frequence: contexte.sampleRate, mode, msDeChauffe };
}

/** Combien de millisecondes la premiere ouverture du materiel a coute. Zero
 *  ensuite. Publie par `diagnostic` pour que ce ne soit jamais une croyance. */
let msDeChauffe = 0;

/**
 * ATTENDRE QUE LE GRAPHE BATTE VRAIMENT, ET NON QU'IL SOIT CONSTRUIT.
 *
 * LE DEFAUT, MESURE AU NAVIGATEUR PILOTE LE 2026-08-28. La toute premiere
 * ecoute de la vie du navigateur a rendu ZERO trame en sept cents
 * millisecondes, alors que `preparer` avait deja rendu la main. Les ecoutes
 * suivantes, et meme la premiere apres un rechargement de page, n'en perdent
 * que quatre-vingt-cinq. Ce n'est donc pas le chargement du worklet, c'est
 * l'OUVERTURE DU MATERIEL AUDIO, qui n'arrive qu'une fois par processus.
 *
 * POURQUOI JE NE LE LAISSE PAS PASSER. C'est une fois par utilisateur, et
 * c'est exactement la premiere note qu'il chante. Mon marche entier repose
 * sur le fait que les concurrents n'entendent pas leurs acheteurs, et le
 * premier avis d'un acheteur qui n'a pas ete entendu dit toujours la meme
 * chose. Sept cents millisecondes au mauvais moment coutent plus cher qu'une
 * erreur de dix cents pendant une heure.
 *
 * LA PARADE. Une source SILENCIEUSE est branchee sur le collecteur, et on
 * attend une vraie trame avant de rendre la main. Elle est silencieuse parce
 * qu'un utilisateur ne doit rien entendre, et il faut quand meme une source,
 * car un noeud sans entree branchee n'est pas cadence par le navigateur.
 */
async function degourdir() {
  if (msDeChauffe > 0 || !noeud) return;
  const depart = performance.now();

  const silence = contexte.createConstantSource();
  silence.offset.value = 0;
  silence.connect(noeud);
  silence.start();

  await new Promise((resoudre) => {
    // Un delai de garde, parce qu'un materiel muet ne doit pas bloquer
    // l'ouverture de la seance. Mieux vaut demarrer sourd que ne pas demarrer.
    const garde = setTimeout(fini, 1500);
    const precedent = receveur;
    function fini() {
      clearTimeout(garde);
      receveur = precedent;
      try { silence.stop(); silence.disconnect(); } catch { /* deja arrete */ }
      resoudre();
    }
    receveur = () => fini();
  });

  msDeChauffe = Math.round(performance.now() - depart);
}

async function brancherMicro() {
  fluxMicro = await navigator.mediaDevices.getUserMedia({
    audio: {
      // LES TROIS QUI DETRUIRAIENT LA MESURE. Voir le piege n2.
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: false,
      channelCount: 1,
    },
  });
  contexte.createMediaStreamSource(fluxMicro).connect(noeud);
}

/**
 * Ouvre une ecoute. Rend un objet dont `arreter` clot la tentative et rend les
 * trames accumulees, exactement comme la version mobile.
 *
 * `surTrame` permet a l'ecran de bouger le curseur en direct, sans que ce
 * fichier sache ce qu'est un curseur.
 *
 * `sourceDeTest`, une frequence en hertz, remplace le microphone par un son
 * de synthese riche. Voir la note sur le banc plus bas.
 */
async function ecouter(surTrame, sourceDeTest = null) {
  await preparer(sourceDeTest === null);

  const frequence = contexte.sampleRate;
  // LA DUREE D'UNE TRAME, DEDUITE ET NON SUPPOSEE. Voir le piege n1.
  const msParTrame = (TAILLE_FENETRE / frequence) * 1000;

  const trames = [];
  let vivant = true;
  const aArreter = [];

  // LE BANC EN NAVIGATEUR, ET POURQUOI IL VIT DANS LE FICHIER DE PRODUIT.
  // Ce fichier est le seul de la version web que je ne peux pas eprouver en
  // Node, faute d'AudioContext. Il faut donc l'eprouver DANS un navigateur, et
  // un navigateur pilote par machine n'a pas de microphone. En remplacant la
  // seule source par un son de frequence connue, tout le reste de la chaine
  // est parcouru pour de vrai, worklet compris, a la vraie frequence du
  // materiel. Ce que ce mode NE prouve PAS, et je le dis, c'est la capture
  // elle-meme, le gain d'entree et la latence du bus audio.
  if (sourceDeTest !== null) {
    // Un son HARMONIQUEMENT RICHE, pas une sinusoide. La mesure du 2026-08-28
    // montre que YIN lit une sinusoide jusqu'a trente cents trop haut dans le
    // grave. Un banc bati sur une sinusoide mesurerait ce biais au lieu de
    // mesurer la chaine audio.
    const melange = contexte.createGain();
    melange.gain.value = 0.28;
    for (let h = 1; h <= 6; h++) {
      const osc = contexte.createOscillator();
      osc.type = "sine";
      osc.frequency.value = sourceDeTest * h;
      const g = contexte.createGain();
      g.gain.value = 1 / h;
      osc.connect(g);
      g.connect(melange);
      osc.start();
      aArreter.push(osc);
    }
    melange.connect(noeud);
    aArreter.push({ stop: () => melange.disconnect() });
  }

  receveur = (echantillons) => {
    if (!vivant) return;
    const r = yinDetect(echantillons, frequence, VOLUME_MIN);
    // L'AFFINAGE, AJOUTE LE 2026-08-31. Le detecteur lit systematiquement trop
    // haut, d'un cent sur un la et de trente dans le grave, pour une raison
    // arithmetique expliquee dans `affinerHauteur`. Sans cette ligne le
    // moniteur de la page d'accueil et l'entrainement diraient deux nombres
    // differents sur la meme note tenue, et un eleve qui voit ca ne croit plus
    // aucun des deux.
    const trame = {
      hz: r.hz > 0 ? affinerHauteur(echantillons, r.hz, frequence) : r.hz,
      confiance: r.confiance,
    };
    trames.push(trame);
    if (surTrame) surTrame(trame);
  };

  return {
    frequence,
    msParTrame,
    mode,
    get nbTrames() { return trames.length; },
    async arreter() {
      vivant = false;
      receveur = null;
      for (const o of aArreter) { try { o.stop(); } catch { /* deja arrete */ } }
      // LE CONTEXTE RESTE VIVANT. C'est tout l'objet de la correction du
      // piege n4. Le fermer ici couterait le debut de la tentative suivante.
      return trames;
    },
  };
}

/** Libere le materiel. A appeler quand l'utilisateur quitte la seance, pas
 *  entre deux notes. Le voyant du microphone s'eteint ici et nulle part
 *  ailleurs, ce qui est aussi une question de confiance. */
async function liberer() {
  receveur = null;
  if (fluxMicro) {
    for (const piste of fluxMicro.getTracks()) piste.stop();
    fluxMicro = null;
  }
  if (contexte && contexte.state !== "closed") {
    try { await contexte.close(); } catch { /* deja ferme */ }
  }
  contexte = null;
  noeud = null;
  mode = null;
  // La chauffe est un fait du CONTEXTE, pas du processus. Un contexte ferme
  // puis rouvert se rechauffe, donc le compteur repart. L'oublier ici ferait
  // sauter la parade a la seance suivante, en silence.
  msDeChauffe = 0;
}

/**
 * Le microphone est-il seulement accessible ici. Un site servi en clair, hors
 * de localhost, n'y a PAS droit, et le message d'erreur du navigateur ne le
 * dit pas clairement. Autant le dire nous-memes.
 */
function diagnostic() {
  const secure = window.isSecureContext === true;
  const api = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  return {
    contexteSecurise: secure,
    apiPresente: api,
    utilisable: secure && api,
    prepare: !!contexte,
    frequence: contexte ? contexte.sampleRate : null,
    mode,
    msDeChauffe,
    raison: !api
      ? "ce navigateur n'expose pas l'acces au microphone"
      : !secure
        ? "le microphone exige une page servie en HTTPS, ou en local"
        : "",
  };
}
  return { TAILLE_FENETRE, VOLUME_MIN, preparer, ecouter, liberer, diagnostic };
})();

const racine = document.getElementById("racine");

function appliquerPalette() {
  const p = palette();

  s.setProperty("--texte", p.texte);
  s.setProperty("--faible", p.texteFaible);
  s.setProperty("--accent", p.accent);
  s.setProperty("--sur-accent", p.surAccent);
}

function el(balise, attrs = {}, enfants = []) {
  const n = document.createElement(balise);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "onclick") n.addEventListener("click", v);
    else if (k === "texte") n.textContent = v;
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const e of [].concat(enfants)) {
    if (e) n.appendChild(typeof e === "string" ? document.createTextNode(e) : e);
  }
  return n;
}

function rendre() {
  appliquerPalette();
  racine.textContent = "";

  carte.appendChild(el("div", {
    class: "invisible", role: "status", "aria-live": "polite", texte: v.annonce,
  }));
  return carte;
}

// --- le journal visible ----------------------------------------------------
function bandeauJournal() {
  const d = el("details", { class: "journal" });
  d.appendChild(el("summary", { texte: t("details_techniques", app.langue) || "details" }));
  const ul = el("ul");
  for (const l of app.journal) ul.appendChild(el("li", { texte: l }));
  d.appendChild(ul);
  return d;
}

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------
function demarrer(avecMicro = true) {
  const ids = seanceDuJour(app.valides, 5, catalogue());
  app.etat = ouvrir(ids, ctx().toniqueMidi, catalogue());
  app.dernier = null;
  noter(`session started, ${ids.length} exercises, tonic ${ctx().toniqueMidi}`);
  rendre();
  // ON PREPARE L'AUDIO MAINTENANT, PAS AU PREMIER BOUTON ECOUTER.
  // Mesure du 2026-08-28 en navigateur, la creation du contexte audio coute
  // assez de temps pour que la PREMIERE tentative rende zero trame, et le
  // produit repondait alors "rien entendu" a quelqu'un qui chantait juste.
  // On paie ce cout pendant que l'utilisateur lit sa premiere note. C'est
  // aussi le bon moment pour demander le microphone, une fois, en entrant.
  preparer(avecMicro).then(
    (info) => noter(`audio ready, ${info.frequence} Hz, mode ${info.mode}, `
      + `warm-up ${info.msDeChauffe} ms`),
    (e) => {
      noter(`audio unavailable, ${e && e.name ? e.name : e}`);
      app.alerte = t("micro_refuse", app.langue);
      rendre();
    },
  );
}

async function actionBouton(cle) {
  // La touche `ecouter` du noyau est l'AIDE, faire entendre la note apres
  // trois echecs. Elle n'ouvre pas le microphone, c'est le bouton principal
  // qui s'en charge. Elle n'a pas encore de son a jouer, exactement comme sur
  // mobile, donc elle ne fait rien plutot que de faire la mauvaise chose.
  if (cle === "ecouter") return;
  if (cle === "reessayer") { app.dernier = null; rendre(); return; }
  if (cle === "suivant" || cle === "terminer") {
    // LE CINQUIEME DEFAUT, ET LE PLUS COUTEUX POUR L'APPRENANT.
    //
    // `exerciceSuivant` ne passe pas a la note suivante, il ABANDONNE
    // l'exercice en cours et saute au suivant. Or le noyau rend un bouton
    // "Suivant" des qu'une NOTE est finie, pas seulement quand l'exercice
    // l'est. La version web appelait `exerciceSuivant` sans regarder l'etape,
    // donc chaque note validee jetait le reste de son exercice.
    //
    // MESURE DU 2026-08-28. Cinq tentatives, cinq verdicts EXCELLENT, ecart
    // moyen de trois cents, et le resume annoncait "5 sur 16", un score de 53
    // et le mot "A revoir" sur un ton d'echec. Le produit disait a quelqu'un
    // qui avait tout chante juste qu'il avait rate. Pour un entraineur de
    // justesse, c'est le pire mensonge possible.
    //
    // La version mobile ne se trompait pas, elle teste l'etape. Le noyau ne se
    // trompait pas non plus. C'est la troisieme fois de la journee que le
    // defaut est dans le cablage web et nulle part ailleurs.
    if (app.etat.etape === "EXERCICE_FINI" || app.etat.etape === "SEANCE_FINIE") {
      app.etat = exerciceSuivant(app.etat);
    }
    app.dernier = null;
    rendre();
    return;
  }
}

async function demarrerEcoute() {
  try {
    // Une alerte se leve a chaque nouvelle tentative, sinon elle survivrait a
    // sa cause et accuserait le navigateur apres qu'il a donne son accord.
    app.alerte = null;
    app.curseurVif = 0;

    // LE DEFAUT LE PLUS SOURNOIS DES QUATRE, MESURE LE 2026-08-28.
    // `getUserMedia` ne rend la main NI en accord NI en refus tant que
    // l'utilisateur n'a pas repondu a la barre d'autorisation du navigateur.
    // Beaucoup ne repondent jamais, ils la ferment ou ils l'ignorent. Le
    // produit restait alors bloque POUR TOUJOURS sur un ecran qui demande de
    // chanter, sans rien ecouter, sans un message, et sans meme une erreur
    // dans la console. Ni un banc ni une relecture ne pouvaient le voir, il
    // fallait cliquer le bouton et attendre.
    app.attente = true;
    rendre();
    const patience = setTimeout(() => {
      if (!app.attente) return;
      // ON REND AUSSI LE BOUTON, ET PAS SEULEMENT LE MESSAGE. Le premier jet
      // affichait "retouchez le bouton" au-dessus d'un bouton qui restait
      // inactif pour toujours, puisque la promesse ne se resout jamais. Un
      // message qui demande un geste que l'ecran interdit est pire que pas de
      // message, il fait passer l'utilisateur pour l'idiot de l'histoire.
      app.attente = false;
      app.alerte = t("micro_refuse", app.langue);
      rendre();
    }, 6000);
    // LE CHAMP EST note.note.hz, PAS note.cibleHz. Le nom que j'avais ecrit
    // n'existe pas, et le seul effet visible aurait ete un curseur qui ne
    // bouge jamais pendant l'ecoute. Trouve en faisant tourner la page dans
    // un vrai navigateur le 2026-08-28, invisible a la relecture.
    const cibleHz = app.etat.notes[app.etat.indexNote]?.note?.hz ?? 0;
    app.ecoute = await ecouter((trame) => {
      if (trame.hz > 0 && cibleHz > 0) {
        app.curseurVif = positionCurseur(trame.hz, cibleHz);
        majCurseurVif();
      }
    });
    clearTimeout(patience);
    app.attente = false;
    app.alerte = null;
    noter(`microphone open, ${app.ecoute.frequence} Hz, `
      + `${app.ecoute.msParTrame.toFixed(1)} ms par trame, mode ${app.ecoute.mode}`);
    rendre();
  } catch (e) {
    app.attente = false;
    noter(`microphone refused, ${e && e.name ? e.name : e}`);
    // ET ON LE DIT A L'UTILISATEUR, PAS SEULEMENT AU JOURNAL TECHNIQUE.
    // Le journal vit dans un bloc replie que personne n'ouvre. Un microphone
    // refuse laissait donc un ecran qui demande de chanter, sans rien
    // ecouter et sans un mot d'explication. C'est exactement le grief que
    // mes concurrents recoltent depuis quatre ans, et il aurait ete de ma
    // faute et non de celle du navigateur.
    app.alerte = t("micro_refuse", app.langue);
    rendre();
  }
}

function majCurseurVif() {
  // Deplacement direct du curseur, sans reconstruire l'ecran. Reconstruire
  // vingt fois par seconde ferait clignoter le texte et couterait de la
  // batterie pour rien.
  const c = racine.querySelector(".curseur");
  if (c) c.style.left = `${50 + Math.max(-1, Math.min(1, app.curseurVif)) * 50}%`;
}

async function arreterEcoute() {
  if (!app.ecoute) return;
  const ecoute = app.ecoute;
  app.ecoute = null;
  const trames = await ecoute.arreter();
  const note = app.etat.notes[app.etat.indexNote];
  const reglages = reglagesPour(app.entree, app.tessiture, {
    msParTrame: ecoute.msParTrame,
  });
  const retour = tenter(app.etat, trames, reglages);
  app.etat = retour.etat;
  app.dernier = retour.resultat;
  const voisees = trames.filter((t) => t.hz > 0).length;
  noter(`${trames.length} frames, ${voisees} voiced, `
    + `verdict ${retour.resultat.verdict}, `
    + `${retour.resultat.ecartCents === null ? "no deviation" : retour.resultat.ecartCents.toFixed(1) + " cents"}`);
  if (retour.resultat.verdict === "EXCELLENT" || retour.resultat.verdict === "BIEN") {
    const id = app.etat.exercices[app.etat.indexExercice];
    if (id && !app.valides.includes(id)) app.valides.push(id);
  }
  rendre();
}

// ---------------------------------------------------------------------------
// Demarrage
// ---------------------------------------------------------------------------
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
  app.mode = e.matches ? "sombre" : "clair";
  rendre();
});

// Expose l'etat pour le banc d'essai en navigateur. Aucune donnee n'en sort,
// c'est une lucarne de lecture, et elle sert a prouver que le produit tourne.
window.__steady = {
  app,
  vue: () => (app.etat ? vue(app.etat, app.dernier, ctx()) : null),
  resume: () => (app.etat ? vueResume(app.etat, ctx()) : null),
  demarrer,
  actionBouton,
  diagnostic,
  /** LE BANC AUDIO EN NAVIGATEUR. Fait passer un son de frequence connue par
   *  la chaine reelle, worklet compris, et rend ce que le noyau en a fait.
   *  C'est le seul moyen d'eprouver `micro-web.js` sans microphone. */
  /** LA BOUCLE PRODUIT COMPLETE, avec du vrai son, dans un vrai navigateur.
   *  Ouvre le micro de test sur `hz`, laisse tourner, puis passe les trames
   *  au NOYAU par le meme chemin qu'un utilisateur qui chante. Rien n'est
   *  court-circuite entre le son et le verdict. */
  async tenterAvecSon(hz, dureeMs = 900) {
    const ecoute = await ecouter((trame) => {
      const cible = app.etat.notes[app.etat.indexNote]?.note?.hz ?? 0;
      if (trame.hz > 0 && cible > 0) {
        app.curseurVif = positionCurseur(trame.hz, cible);
      }
    }, hz);
    await new Promise((r) => setTimeout(r, dureeMs));
    const trames = await ecoute.arreter();
    const reglages = reglagesPour(app.entree ?? "voix", app.tessiture, {
      msParTrame: ecoute.msParTrame,
    });
    const retour = tenter(app.etat, trames, reglages);
    app.etat = retour.etat;
    app.dernier = retour.resultat;
    noter(`test tone, ${trames.length} frames, verdict ${retour.resultat.verdict}`);
    rendre();
    return {
      verdict: retour.resultat.verdict,
      ecartCents: retour.resultat.ecartCents,
      accepte: retour.accepte,
      trames: trames.length,
      msParTrame: ecoute.msParTrame,
    };
  },
  async bancAudio(hz, dureeMs = 900) {
    const ecoute = await ecouter(null, hz);
    await new Promise((r) => setTimeout(r, dureeMs));
    const trames = await ecoute.arreter();
    const voisees = trames.filter((t) => t.hz > 0);
    const mediane = voisees.length
      ? voisees.map((t) => t.hz).sort((a, b) => a - b)[voisees.length >> 1]
      : -1;
    return {
      frequence: ecoute.frequence,
      msParTrame: ecoute.msParTrame,
      mode: ecoute.mode,
      nbTrames: trames.length,
      nbVoisees: voisees.length,
      medianeHz: mediane,
      ecartCents: mediane > 0 ? 1200 * Math.log2(mediane / hz) : null,
      confianceMoyenne: voisees.length
        ? voisees.reduce((a, t) => a + t.confiance, 0) / voisees.length : 0,
    };
  },
};

rendre();
})();

</script>
